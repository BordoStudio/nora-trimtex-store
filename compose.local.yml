services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trimmora
      POSTGRES_USER: trimmora
      POSTGRES_PASSWORD: trimmora-local
    ports:
      - "5432:5432"
    volumes:
      - trimmora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimmora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trimmora_postgres:
