services:
  - type: web
    name: nora-trimtex-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: nora_trimtex
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: CORS_ORIGINS
        sync: false
      - key: ASSETS_PUBLIC_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        value: "Nora TrimTex <info@noratrim.com>"
      - key: NOTIFICATION_TO_EMAIL
        value: bordo.studio1@gmail.com
      - key: STOREFRONT_URL
        sync: false
      - key: ADMIN_URL
        value: https://admin.noratrim.com
      - key: AUTH_SESSION_DAYS
        value: 30
      - key: PRIVACY_IP_SALT
        generateValue: true
      - key: ADMIN_EMAIL
        value: bordo.studio1@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
